<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>شفاء - لوحة التحكم</title>
    <!-- Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts: Cairo & Tajawal -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@500&display=swap" rel="stylesheet"/>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Tailwind Config -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-highest": "#e0e3e5",
                        "surface-container": "#eceef0",
                        "primary-fixed": "#dbe1ff",
                        "surface-variant": "#e0e3e5",
                        "primary-container": "#2563eb",
                        "on-primary-container": "#eeefff",
                        "outline": "#737686",
                        "primary": "#004ac6",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#f7f9fb",
                        "on-surface": "#191c1e",
                        "on-surface-variant": "#434655",
                        "outline-variant": "#c3c6d7",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#bc4800",
                        "tertiary-fixed": "#ffdbcd",
                        "on-tertiary-fixed": "#360f00",
                        "secondary": "#0053db",
                        "on-secondary": "#ffffff",
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                    spacing: { "stack-md": "1rem", "section-padding": "1.5rem", "container-margin": "1.25rem", "stack-sm": "0.5rem" },

    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* Modal Transitions */
        .modal-enter { opacity: 0; pointer-events: none; }
        .modal-enter-active { opacity: 1; pointer-events: auto; transition: opacity 0.3s ease-out; }
        .sheet-enter { transform: translateY(100%); }
        .sheet-enter-active { transform: translateY(0); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        /* Tab Button Styling for 4 items */
        .modal-tab-btn { flex: 1; padding: 0.5rem 0.25rem; font-size: 12px; font-weight: 700; border-radius: 0.375rem; text-align: center; transition: all 0.2s; white-space: nowrap; }
        .modal-tab-btn.active { background-color: #2563eb; color: #ffffff; }
        .modal-tab-btn.inactive { color: #434655; background-color: transparent; }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-sm min-h-screen relative overflow-x-hidden">
    
    <!-- TopAppBar -->
    <header class="fixed top-0 w-full z-40 bg-surface/80 backdrop-blur-md shadow-sm flex justify-between items-center px-container-margin py-stack-sm rtl">
        <div class="flex items-center gap-2 w-1/4">
            <span class="font-display-lg-mobile text-display-lg-mobile text-primary font-bold">شفاء</span>
        </div>
        <div class="flex-1 max-w-sm mx-auto">
            <div class="relative bg-surface-container-low rounded-full px-4 py-2 flex items-center shadow-inner">
                <span class="material-symbols-outlined text-on-surface-variant mr-2 text-[20px]">search</span>
                <input class="bg-transparent border-none focus:ring-0 text-body-sm w-full outline-none text-on-surface placeholder:text-on-surface-variant/70" placeholder="بحث عن مريض..." type="text"/>
            </div>
        </div>
    </header>

    <!-- Main Content Canvas -->
    <main class="pt-[80px] pb-[100px] px-container-margin md:max-w-[600px] md:mx-auto">
        <!-- Tabs -->
        <div class="flex overflow-x-auto hide-scrollbar gap-stack-sm py-stack-sm mb-stack-md" id="statusTabs">
            <button class="tab-btn active px-5 py-2 rounded-full font-label-md text-label-md bg-primary-container text-on-primary-container shadow-sm whitespace-nowrap transition-all duration-200" data-status="pending">جديد</button>
            <button class="tab-btn px-5 py-2 rounded-full font-label-md text-label-md bg-surface-container text-on-surface-variant hover:bg-surface-container-highest whitespace-nowrap transition-all duration-200" data-status="in_progress">جاري</button>
            <button class="tab-btn px-5 py-2 rounded-full font-label-md text-label-md bg-surface-container text-on-surface-variant hover:bg-surface-container-highest whitespace-nowrap transition-all duration-200" data-status="completed">مكتمل</button>
            <button class="tab-btn px-5 py-2 rounded-full font-label-md text-label-md bg-surface-container text-on-surface-variant hover:bg-surface-container-highest whitespace-nowrap transition-all duration-200" data-status="cancelled">ملغي</button>
        </div>

        <!-- Booking Cards List -->
        <div id="bookingsList" class="flex flex-col gap-stack-md">
            <div class="text-center p-8 text-on-surface-variant">جاري الاتصال بالنظام...</div>
        </div>
    </main>

    <!-- Floating Action Button -->
    <button class="fixed bottom-[40px] left-container-margin w-14 h-14 bg-primary text-on-primary rounded-full shadow-lg flex items-center justify-center hover:scale-105 active:scale-95 transition-transform z-30" onclick="openGenericModal('emergencyModal', 'modalSheet')">
        <span class="material-symbols-outlined text-[28px]">add</span>
    </button>

    <!-- ========================================== -->
    <!-- نافذة تفاصيل الحجز الشاملة (Details Modal) -->
    <!-- ========================================== -->
    <div class="fixed inset-0 z-50 modal-enter hidden" id="detailsModal">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeDetailsModal()"></div>
        <!-- Sheet -->
        <div class="absolute bottom-0 w-full h-[90vh] bg-surface-container-lowest rounded-t-2xl shadow-2xl sheet-enter flex flex-col" id="detailsSheet">
            
            <!-- Header -->
            <div class="flex justify-between items-center p-4 border-b border-surface-container">
                <h2 class="font-headline-md-mobile font-bold text-on-surface flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary">manage_accounts</span> إدارة الحجز
                </h2>
                <button onclick="closeDetailsModal()" class="w-8 h-8 bg-surface-container rounded-full flex items-center justify-center text-on-surface-variant active:scale-90">
                    <span class="material-symbols-outlined text-[20px]">close</span>
                </button>
            </div>

            <!-- معلومات المريض والتبويبات الأربعة -->
            <div class="p-4 bg-surface flex flex-col items-center border-b border-surface-container">
                <h3 id="detailPatientName" class="font-bold text-[18px] text-on-surface">---</h3>
                <p id="detailPatientPhone" class="text-[14px] text-on-surface-variant mt-1" dir="ltr">---</p>
                
                <!-- أزرار التبويبات -->

                    <button onclick="switchModalTab('schedule')" id="mTabSchedule" class="modal-tab-btn inactive">الجدولة</button>

            <!-- 1. التبويب الإداري -->
            <div id="secAdmin" class="flex-1 overflow-y-auto p-6 space-y-6 flex flex-col">
                <div>
                    <label class="block text-[14px] font-bold mb-2">حالة الحجز</label>

                        <option value="in_progress">جاري التنفيذ</option>
                        <option value="completed">مكتمل</option>

                </div>
                <div>

                    <div class="relative">

                </div>
                <div class="mt-auto pt-4 border-t border-surface-container">
                    <button id="saveAdminBtn" onclick="saveAdminData()" class="w-full bg-primary text-on-primary rounded-full py-4 font-bold shadow-sm active:scale-[0.98] transition-transform flex justify-center items-center gap-2">
                        حفظ البيانات الإدارية <span class="material-symbols-outlined text-[18px]">save</span>
                    </button>
                </div>
            </div>

            <!-- 2. تبويب الجدولة والموقع -->
            <div id="secSchedule" class="flex-1 overflow-y-auto p-6 space-y-6 hidden flex-col">
                <div>
                    <label class="block text-[14px] font-bold mb-2 text-on-surface">موعد الزيارة المحدد</label>
                    <input type="datetime-local" id="detailScheduledAt" class="w-full bg-surface-container border border-outline-variant rounded-xl px-4 py-3.5 outline-none focus:border-primary font-bold text-on-surface" />
                </div>
                <div>
                    <label class="block text-[14px] font-bold mb-2 text-on-surface">العنوان أو رابط الموقع (Location)</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute right-4 top-3.5 text-secondary text-[20px]">location_on</span>
                        <input type="text" id="detailAddress" class="w-full bg-surface-container border border-outline-variant rounded-xl px-12 py-3.5 outline-none focus:border-primary placeholder:text-outline" placeholder="أدخل العنوان أو الصق رابط خرائط جوجل..." />
                    </div>
                </div>
                <div class="mt-auto pt-4 border-t border-surface-container">
                    <button id="saveScheduleBtn" onclick="saveScheduleData()" class="w-full bg-secondary text-on-secondary rounded-full py-4 font-bold shadow-sm active:scale-[0.98] transition-transform flex justify-center items-center gap-2">

                    </button>
                </div>
            </div>

            <!-- 3. التبويب المالي -->
            <div id="secFinance" class="flex-1 overflow-y-auto p-6 space-y-4 hidden flex-col">
                <div>
                    <label class="block text-[14px] font-bold mb-2">إضافة خدمة</label>
                    <div class="flex gap-2">
                        <select id="serviceSelect" class="flex-1 bg-surface-container border border-outline-variant rounded-xl px-4 py-3 outline-none focus:border-primary">
                            <option value="">جاري التحميل...</option>
                        </select>
                        <button onclick="addServiceToCart()" class="bg-primary text-on-primary px-5 rounded-xl font-bold text-[20px] active:scale-95">+</button>
                    </div>
                </div>
                
                <div class="bg-surface-container-low p-4 rounded-xl min-h-[120px] max-h-[180px] overflow-y-auto border border-surface-container" id="cartItemsList">
                    <p class="text-center text-on-surface-variant text-[12px] mt-8">لم يتم إضافة خدمات بعد</p>
                </div>
                
                <div class="flex justify-between items-center font-bold text-[18px] border-t border-surface-container pt-4">
                    <span>الإجمالي:</span>
                    <span class="text-primary"><span id="cartTotalDisplay">0</span> د.ك</span>
                </div>
                
                <div class="mt-auto">
                    <label class="block text-[14px] font-bold mb-2">نوع المعاملة</label>
                    <select id="transactionType" class="w-full bg-surface-container border border-outline-variant rounded-xl px-4 py-3 mb-4 outline-none focus:border-primary">
                        <option value="collected_by_nurse">تحصيل بواسطة الممرض</option>
                        <option value="received_by_company">تحصيل مباشر للشركة</option>

                    <button id="saveFinBtn" onclick="saveFinancials()" class="w-full bg-tertiary-container text-on-tertiary-container rounded-full py-4 font-bold shadow-sm active:scale-[0.98] transition-transform">

            <!-- 4. تبويب التقييمات والملاحظات -->
            <div id="secReviews" class="flex-1 overflow-y-auto p-6 space-y-6 hidden flex-col">
                <div>
                    <label class="block text-[14px] font-bold mb-2">تقييم المريض للخدمة</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute right-4 top-3.5 text-orange-400 text-[20px]">star</span>
                        <select id="detailPatientRating" class="w-full bg-surface-container border border-outline-variant rounded-xl px-12 py-3.5 outline-none focus:border-primary appearance-none font-bold">
                            <option value="">-- لم يتم التقييم --</option>
                            <option value="5">⭐⭐⭐⭐⭐ ممتاز (5)</option>
                            <option value="4">⭐⭐⭐⭐ جيد جداً (4)</option>
                            <option value="3">⭐⭐⭐ جيد (3)</option>
                            <option value="2">⭐⭐ مقبول (2)</option>
                            <option value="1">⭐ سيء (1)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-[14px] font-bold mb-2">تقييم الممرض للحالة</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute right-4 top-3.5 text-primary text-[20px]">medical_information</span>
                        <select id="detailNurseRating" class="w-full bg-surface-container border border-outline-variant rounded-xl px-12 py-3.5 outline-none focus:border-primary appearance-none font-bold">
                            <option value="">-- لم يتم التقييم --</option>
                            <option value="5">⭐⭐⭐⭐⭐ ممتاز (5)</option>
                            <option value="4">⭐⭐⭐⭐ جيد جداً (4)</option>
                            <option value="3">⭐⭐⭐ جيد (3)</option>
                            <option value="2">⭐⭐ مقبول (2)</option>
                            <option value="1">⭐ سيء (1)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-[14px] font-bold mb-2">ملاحظات إدارية (داخلية)</label>
                    <textarea id="detailAdminNotes" rows="3" class="w-full bg-surface-container border border-outline-variant rounded-xl px-4 py-3 outline-none focus:border-primary resize-none placeholder:text-outline" placeholder="اكتب أي ملاحظات أو شكاوى حول الزيارة للرجوع إليها لاحقاً..."></textarea>
                </div>
                <div class="mt-auto pt-4 border-t border-surface-container">
                    <button id="saveReviewsBtn" onclick="saveReviewsData()" class="w-full bg-on-surface-variant text-surface rounded-full py-4 font-bold shadow-sm active:scale-[0.98] transition-transform">
                        حفظ التقييمات
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- نافذة إضافة المريض السريع (Emergency Booking) -->
    <div class="fixed inset-0 z-50 modal-enter hidden" id="emergencyModal">
        <div class="absolute inset-0 bg-black/30 backdrop-blur-sm" onclick="closeGenericModal('emergencyModal', 'modalSheet')"></div>
        <div class="absolute bottom-0 w-full bg-surface-container-lowest rounded-t-xl p-section-padding pb-[40px] shadow-[0_-10px_40px_rgba(0,0,0,0.1)] sheet-enter" id="modalSheet">
            <div class="w-12 h-1.5 bg-surface-variant rounded-full mx-auto mb-stack-md cursor-grab active:cursor-grabbing"></div>
            <div class="flex items-center gap-2 mb-stack-lg">
                <div class="w-10 h-10 rounded-full bg-error-container text-on-error-container flex items-center justify-center">
                    <span class="material-symbols-outlined text-[20px]">emergency</span>
                </div>
                <h2 class="font-headline-md-mobile text-headline-md-mobile text-on-surface font-bold">حجز جديد سريع (طوارئ)</h2>
            </div>
            
            <form id="emergencyForm" class="flex flex-col gap-stack-md">
                <div class="relative">
                    <span class="material-symbols-outlined absolute right-4 top-3.5 text-on-surface-variant text-[20px]">person</span>
                    <input id="patientName" class="w-full bg-surface-container border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-xl px-12 py-3.5 outline-none transition-all placeholder:text-outline" placeholder="اسم المريض بالكامل" required="" type="text"/>
                </div>
                <div class="relative">
                    <span class="material-symbols-outlined absolute right-4 top-3.5 text-on-surface-variant text-[20px]">phone_iphone</span>
                    <input id="patientPhone" class="w-full bg-surface-container border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-xl px-12 py-3.5 outline-none transition-all placeholder:text-outline text-left" dir="ltr" placeholder="رقم الهاتف للتواصل" required="" type="tel"/>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-primary text-on-primary rounded-full py-4 mt-2 font-bold shadow-sm active:scale-[0.98] transition-transform flex justify-center items-center gap-2">
                    تأكيد طلب الطوارئ
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                </button>
            </form>
        </div>
    </div>

    <!-- الكود البرمجي الرئيسي -->
    <script>
        // 1. تهيئة تليجرام
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // دالة حماية النصوص لضمان عدم تعطل الأزرار
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 2. إعدادات Supabase
        const SUPABASE_URL = 'https://zvxzdihonmlglrufrjjl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2eHpkaWhvbm1sZ2xydWZyampsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMjA3MjEsImV4cCI6MjA5ODU5NjcyMX0.cZi4F0K28AiT2aXdr4MUCLbub-zUPUXP1IlPntcxEv8';
        
        // 💡 تذكير: يجب تفعيل RLS على الجداول
        let supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentStatus = 'pending';

        // ==========================================
        // إدارة النوافذ المنبثقة العامة
        // ==========================================
        function openGenericModal(modalId, sheetId) {
            const modal = document.getElementById(modalId);
            const sheet = document.getElementById(sheetId);
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('modal-enter');
                modal.classList.add('modal-enter-active');
                sheet.classList.remove('sheet-enter');
                sheet.classList.add('sheet-enter-active');
            }, 10);
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        function closeGenericModal(modalId, sheetId) {
            const modal = document.getElementById(modalId);
            const sheet = document.getElementById(sheetId);
            modal.classList.remove('modal-enter-active');
            modal.classList.add('modal-enter');
            sheet.classList.remove('sheet-enter-active');
            sheet.classList.add('sheet-enter');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        // ==========================================
        // إدارة نافذة التفاصيل الشاملة
        // ==========================================
        let currentEditingBookingId = null;
        let nursesLoaded = false;
        let allServices = [];
        let bookingCart = [];

        // دالة الإغلاق والتنظيف
        function closeDetailsModal() {
            closeGenericModal('detailsModal', 'detailsSheet');
            currentEditingBookingId = null;
            
            // إفراغ السلة
            bookingCart = []; 
            renderCart(); 
            
            // إفراغ الحقول
            document.getElementById('detailNurse').value = '';
            document.getElementById('detailScheduledAt').value = '';
            document.getElementById('detailAddress').value = '';
            document.getElementById('detailPatientRating').value = '';
            document.getElementById('detailNurseRating').value = '';
            document.getElementById('detailAdminNotes').value = '';
        }

        // جلب البيانات الدقيقة للحجز
        async function fetchAndOpenDetails(bookingId, patientName, patientPhone, status) {
            currentEditingBookingId = bookingId;
            document.getElementById('detailPatientName').innerText = patientName;
            document.getElementById('detailPatientPhone').innerText = patientPhone;
            document.getElementById('detailStatus').value = status;

            switchModalTab('admin');
            openGenericModal('detailsModal', 'detailsSheet');

            if(!nursesLoaded) await loadAvailableNurses();

            // استخدام select(*) لضمان عدم تعطل الطلب لو اختلفت أسماء بعض الأعمدة
            const { data, error } = await supabaseClient
                .from('bookings')
                .select('*')
                .eq('id', bookingId).single();

            if (data && !error) {
                if (data.nurse_id) document.getElementById('detailNurse').value = data.nurse_id;
                
                if (data.scheduled_at) {
                    const d = new Date(data.scheduled_at);
                    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
                    document.getElementById('detailScheduledAt').value = d.toISOString().slice(0,16);
                }
                
                if (data.address) document.getElementById('detailAddress').value = data.address;
                if (data.notes) document.getElementById('detailAdminNotes').value = data.notes;
                if (data.patient_rating) document.getElementById('detailPatientRating').value = data.patient_rating;
                if (data.nurse_rating) document.getElementById('detailNurseRating').value = data.nurse_rating;
            }
        }

        function switchModalTab(tabName) {
            if(tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            const tabs = ['Admin', 'Schedule', 'Finance', 'Reviews'];
            
            tabs.forEach(t => {
                const btn = document.getElementById(`mTab${t}`);
                const sec = document.getElementById(`sec${t}`);
                if(t.toLowerCase() === tabName.toLowerCase()) {
                    btn.className = 'modal-tab-btn active';
                    sec.classList.remove('hidden');
                    sec.classList.add('flex');
                } else {
                    btn.className = 'modal-tab-btn inactive';
                    sec.classList.add('hidden');
                    sec.classList.remove('flex');
                }
            });

            if(tabName === 'finance' && allServices.length === 0) loadServices();
        }

        // ==========================================
        // دوال الحفظ للأقسام
        // ==========================================
        
        // 1. الإداري
        async function saveAdminData() {
            const status = document.getElementById('detailStatus').value;
            const nurse_id = document.getElementById('detailNurse').value;
            const btn = document.getElementById('saveAdminBtn');
            
            btn.innerHTML = 'جاري الحفظ...'; btn.disabled = true;

            const updateData = { status: status };
            if (nurse_id) updateData.nurse_id = nurse_id;

            const { error } = await supabaseClient.from('bookings').update(updateData).eq('id', currentEditingBookingId);
            
            btn.innerHTML = `حفظ البيانات الإدارية <span class="material-symbols-outlined text-[18px]">save</span>`; 
            btn.disabled = false;

            if (error) { 
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert("حدث خطأ. تأكد من صلاحياتك."); 
            } else { 
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); 
                tg.showAlert("تم حفظ الحالة والممرض!"); 
                fetchBookings(currentStatus);
            }
        }

        // 2. الجدولة
        async function saveScheduleData() {
            const scheduled_at = document.getElementById('detailScheduledAt').value;
            const address = document.getElementById('detailAddress').value; 
            const btn = document.getElementById('saveScheduleBtn');
            
            btn.innerHTML = 'جاري الحفظ...'; btn.disabled = true;

            const updateData = {};
            if (scheduled_at) updateData.scheduled_at = new Date(scheduled_at).toISOString();
            if (address) updateData.address = address; 

            const { error } = await supabaseClient.from('bookings').update(updateData).eq('id', currentEditingBookingId);
            
            btn.innerHTML = `حفظ الجدولة والموقع <span class="material-symbols-outlined text-[18px]">map</span>`; 
            btn.disabled = false;

            if (error) { 
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert("حدث خطأ في حفظ الجدولة."); 
            } else { 
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); 
                tg.showAlert("تم حفظ موعد الزيارة والعنوان بنجاح!"); 
            }
        }

        // 3. التقييمات
        async function saveReviewsData() {
            const pRating = document.getElementById('detailPatientRating').value;
            const nRating = document.getElementById('detailNurseRating').value;
            const adminNotes = document.getElementById('detailAdminNotes').value;
            const btn = document.getElementById('saveReviewsBtn');
            
            btn.innerHTML = 'جاري الحفظ...'; btn.disabled = true;

            const updateData = {};
            if (pRating) updateData.patient_rating = parseInt(pRating);
            if (nRating) updateData.nurse_rating = parseInt(nRating);
            if (adminNotes) updateData.notes = adminNotes;

            const { error } = await supabaseClient.from('bookings').update(updateData).eq('id', currentEditingBookingId);
            
            btn.innerHTML = 'حفظ التقييمات'; 
            btn.disabled = false;

            if (error) { 
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert("حدث خطأ أثناء الحفظ."); 
            } else { 
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); 
                tg.showAlert("تم حفظ التقييمات والملاحظات بنجاح!"); 
            }
        }

        // ==========================================
        // المالية والخدمات (السلة)
        // ==========================================
        async function loadAvailableNurses() {
            const nurseSelect = document.getElementById('detailNurse');
            const { data, error } = await supabaseClient.from('nurses').select('id, full_name').eq('is_available', true).eq('is_frozen', false);
            if (!error && data) {
                nurseSelect.innerHTML = '<option value="">-- لم يتم التعيين --</option>' + data.map(n => `<option value="${n.id}">${n.full_name}</option>`).join('');
                nursesLoaded = true;
            }
        }

        async function loadServices() {
            const { data, error } = await supabaseClient.from('services').select('*').eq('is_active', true);
            if (!error && data) {
                allServices = data;
                document.getElementById('serviceSelect').innerHTML = '<option value="">-- اختر خدمة --</option>' + 
                    data.map(s => `<option value="${s.id}">${s.name} (${s.price} د.ك)</option>`).join('');
            }
        }

        function addServiceToCart() {
            const select = document.getElementById('serviceSelect');
            if(!select.value) return;
            const serviceIdString = String(select.value);
            const service = allServices.find(s => String(s.id) === serviceIdString);
            
            if(bookingCart.find(item => String(item.service_id) === serviceIdString)) {
                tg.showAlert("الخدمة مضافة مسبقاً للسلة!"); return;
            }

            bookingCart.push({ service_id: service.id, service_name: service.name, qty: 1, price_at_time: service.price });
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            renderCart(); 
            select.value = ''; 
        }

        function removeService(serviceId) {
            bookingCart = bookingCart.filter(item => String(item.service_id) !== String(serviceId));
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cartItemsList');
            const totalDisplay = document.getElementById('cartTotalDisplay');
            if(bookingCart.length === 0) {
                list.innerHTML = '<p class="text-center text-on-surface-variant text-[12px] mt-8">لم يتم إضافة خدمات بعد</p>';
                totalDisplay.innerText = '0'; return;
            }

            let total = 0;
            list.innerHTML = bookingCart.map(item => {
                total += parseFloat(item.price_at_time);
                return `
                <div class="flex justify-between items-center bg-surface p-3 rounded-lg mb-2 shadow-sm border border-surface-container">
                    <div><p class="font-bold text-[14px]">${item.service_name}</p><p class="text-[12px] text-on-surface-variant">${item.price_at_time} د.ك</p></div>
                    <button onclick="removeService('${item.service_id}')" class="text-error w-8 h-8 flex items-center justify-center bg-error-container rounded-full active:scale-90"><span class="material-symbols-outlined text-[18px]">delete</span></button>
                </div>`;
            }).join('');
            totalDisplay.innerText = total.toFixed(2);
        }

        // 4. الحفظ المالي المعتمد على الـ RPC
        async function saveFinancials() {
            if(bookingCart.length === 0) { 
                tg.showAlert("يرجى إضافة خدمة واحدة على الأقل للسلة."); 
                return; 
            }
            
            const btn = document.getElementById('saveFinBtn');
            btn.innerHTML = 'جاري الحفظ...'; 
            btn.disabled = true;

            let totalAmount = bookingCart.reduce((sum, item) => sum + parseFloat(item.price_at_time), 0);
            const transactionType = document.getElementById('transactionType').value;

            try {
                // نعتمد على الدالة المبرمجة مسبقاً لحفظ الإجمالي وعناصر السلة بأمان تام كعملية واحدة (Atomic)
                const { error } = await supabaseClient.rpc('update_booking_financials', {
                    p_booking_id: currentEditingBookingId,
                    p_cart_data: bookingCart,
                    p_total_amount: totalAmount,
                    p_transaction_type: transactionType,
                    p_log_date: new Date().toISOString()
                });
                
                if (error) throw error;
                
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                tg.showAlert("تم حفظ الخدمات وتحديث القيد المالي بنجاح!");
                closeDetailsModal();
                fetchBookings(currentStatus);
                
            } catch (err) {
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert("حدث خطأ مالي. تأكد من إعدادات قاعدة البيانات.");
                console.error(err);
            } finally {
                btn.innerHTML = 'تأكيد وحفظ الفاتورة'; 
                btn.disabled = false;
            }
        }

        // ==========================================
        // الإعداد الرئيسي والاتصال
        // ==========================================
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                if(tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
                tabs.forEach(t => t.className = 'tab-btn px-5 py-2 rounded-full font-label-md text-label-md bg-surface-container text-on-surface-variant hover:bg-surface-container-highest whitespace-nowrap transition-all duration-200');
                tab.className = 'tab-btn active px-5 py-2 rounded-full font-label-md text-label-md bg-primary-container text-on-primary-container shadow-sm whitespace-nowrap transition-all duration-200';
                currentStatus = tab.dataset.status;
                fetchBookings(currentStatus);
            });
        });

        async function initApp() {
            try {
                if (!tg.initData) throw new Error("لم يتم العثور على بيانات تليجرام. افتح من الزر المخصص داخل البوت.");
                
                const authResponse = await fetch(`${SUPABASE_URL}/functions/v1/telegram-auth`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: tg.initData })
                });
                
                if (!authResponse.ok) throw new Error(`SERVER_ERROR: ${authResponse.status}`);
                
                const authData = await authResponse.json();
                
                // إعادة تعيين العميل بالتوكن الصحيح لاختراق جدار الحماية
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                    global: { headers: { Authorization: `Bearer ${authData.token}` } }
                });

                fetchBookings(currentStatus);
                subscribeToRealtime();

            } catch (error) { 
                document.getElementById('bookingsList').innerHTML = `<div class="text-left p-6 text-error font-bold bg-error-container rounded-2xl"><span class="text-[12px]">Error:</span><br>${error.message}</div>`;
            }
        }

        function subscribeToRealtime() {
            if(!supabaseClient) return;
            supabaseClient.channel('public:bookings')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, payload => {
                    fetchBookings(currentStatus);
                }).subscribe();
        }

        async function fetchBookings(status) {
            if (!supabaseClient) return;
            const list = document.getElementById('bookingsList');
            list.innerHTML = '<div class="text-center p-8 text-on-surface-variant animate-pulse">جاري التحميل...</div>';

            const { data, error } = await supabaseClient.from('bookings').select('id, patient_name, patient_phone, status, created_at').eq('status', status).order('created_at', { ascending: false });

            if (error) { list.innerHTML = `<div class="text-center p-4 text-error">حدث خطأ في التحميل</div>`; return; }
            if (data.length === 0) { list.innerHTML = `<div class="text-center p-8 text-on-surface-variant">لا توجد حجوزات</div>`; return; }

            list.innerHTML = data.map(booking => {
                let badgeClass = 'bg-tertiary-fixed text-on-tertiary-fixed';
                let badgeText = 'قيد الانتظار'; let icon = 'schedule';
                if(booking.status === 'in_progress') { badgeClass = 'bg-primary-fixed text-on-primary-fixed'; badgeText = 'جاري التنفيذ'; icon = 'vital_signs'; }
                else if(booking.status === 'completed') { badgeClass = 'bg-secondary-fixed text-on-secondary-fixed'; badgeText = 'مكتمل'; icon = 'check_circle'; }
                else if(booking.status === 'cancelled') { badgeClass = 'bg-error-container text-on-error-container'; badgeText = 'ملغي'; icon = 'cancel'; }

                const diffHours = Math.floor((new Date() - new Date(booking.created_at)) / (1000 * 60 * 60));
                const timeStr = diffHours < 1 ? 'منذ أقل من ساعة' : `منذ ${diffHours} ساعة`;

                const safeName = escapeHtml(booking.patient_name);
                const safePhone = escapeHtml(booking.patient_phone);

                return `
                <div class="bg-surface-container-lowest rounded-2xl p-section-padding shadow-[0_4px_20px_rgba(15,23,42,0.05)] flex flex-col gap-stack-sm relative overflow-hidden group" onclick="fetchAndOpenDetails('${booking.id}', '${safeName}', '${safePhone}', '${booking.status}')">
                    <div class="absolute top-0 right-0 w-1 h-full ${booking.status === 'pending' ? 'bg-tertiary-container' : 'bg-primary'} rounded-r-2xl"></div>
                    <div class="flex justify-between items-start cursor-pointer">
                        <div class="pr-2">
                            <h3 class="font-bold text-[18px] text-on-surface mb-1">${safeName}</h3>
                            <p class="font-body-sm text-on-surface-variant flex items-center gap-1.5"><span class="material-symbols-outlined text-[16px] text-outline">call</span><span dir="ltr">${safePhone}</span></p>
                        </div>
                        <span class="${badgeClass} px-3 py-1 rounded-full text-[12px] font-bold flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">${icon}</span>${badgeText}</span>
                    </div>
                </div>`;
            }).join('');
        }

        // ==========================================
        // طلب الطوارئ (الإضافة السريعة)
        // ==========================================
        document.getElementById('emergencyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('patientName').value.trim();
            const phone = document.getElementById('patientPhone').value.trim();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = 'جاري التسجيل...'; btn.disabled = true;

            try {
                const { error } = await supabaseClient.rpc('create_emergency_booking', { p_name: name, p_phone: phone, p_source: 'telegram_miniapp' });
                if (error) throw error;
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                closeGenericModal('emergencyModal', 'modalSheet');
                document.getElementById('emergencyForm').reset();
            } catch (err) {
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert("حدث خطأ أثناء التسجيل.");
            } finally {
                btn.innerHTML = `تأكيد طلب الطوارئ <span class="material-symbols-outlined text-[18px]">arrow_forward</span>`; btn.disabled = false;
            }
        });

        // تشغيل النظام
        initApp();
    </script>
</body>
</html>
