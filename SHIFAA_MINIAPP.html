<!-- استدعاء مكتبة Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // 1. تهيئة تليجرام
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    // 2. إعدادات Supabase
    const SUPABASE_URL = 'ضع_رابط_المشروع_هنا';
    const SUPABASE_ANON_KEY = 'ضع_مفتاح_anon_هنا';
    
    // مبدئياً سنستخدم العميل المباشر للتجربة (لاحقاً سنربطه بدالة telegram-auth)
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 3. إدارة النوافذ المنبثقة (Modal)
    const modal = document.getElementById('emergencyModal');
    const sheet = document.getElementById('modalSheet');

    function openModal() {
        modal.classList.remove('hidden');
        setTimeout(() => {
            modal.classList.remove('modal-enter');
            modal.classList.add('modal-enter-active');
            sheet.classList.remove('sheet-enter');
            sheet.classList.add('sheet-enter-active');
        }, 10);
        if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    }

    function closeModal() {
        modal.classList.remove('modal-enter-active');
        modal.classList.add('modal-enter');
        sheet.classList.remove('sheet-enter-active');
        sheet.classList.add('sheet-enter');
        setTimeout(() => { modal.classList.add('hidden'); }, 300);
    }

    // 4. إرسال الطلب اليدوي الآمن
    document.getElementById('emergencyForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('patientName').value.trim();
        const phone = document.getElementById('patientPhone').value.trim();

        if (!name || !phone) {
            tg.showAlert("يرجى إدخال الاسم ورقم الهاتف.");
            return;
        }

        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.innerHTML = 'جاري التسجيل...';
        submitBtn.disabled = true;

        try {
            const { error } = await supabaseClient.rpc('create_emergency_booking', {
                p_name: name,
                p_phone: phone,
                p_source: 'telegram_miniapp'
            });

            if (error) throw error;

            tg.HapticFeedback.notificationOccurred('success');
            closeModal();
            document.getElementById('emergencyForm').reset();
            
            // تحديث القائمة بعد الإضافة
            const activeTab = document.querySelector('.tab-btn.bg-primary-container').dataset.target;
            fetchBookings(activeTab);

        } catch (err) {
            tg.showAlert("حدث خطأ أثناء التسجيل.");
            console.error(err);
        } finally {
            submitBtn.innerHTML = 'تأكيد طلب الطوارئ';
            submitBtn.disabled = false;
        }
    });

    // 5. التبويبات وجلب الحجوزات
    const tabs = document.querySelectorAll('.tab-btn');
    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            // إعادة ضبط شكل التبويبات
            tabs.forEach(t => {
                t.className = 'tab-btn px-5 py-2 rounded-full font-label-md text-label-md bg-surface-container-low text-on-surface-variant hover:bg-surface-container whitespace-nowrap transition-all duration-200';
            });
            // تفعيل التبويب الحالي
            tab.className = 'tab-btn px-5 py-2 rounded-full font-label-md text-label-md bg-primary-container text-on-primary-container shadow-sm whitespace-nowrap transition-all duration-200';
            
            if(tg.HapticFeedback) tg.HapticFeedback.selectionChanged();

            // خريطة تحويل التبويبات إلى حالات قاعدة البيانات
            const statusMap = { 'new': 'pending', 'progress': 'in_progress', 'completed': 'completed', 'cancelled': 'cancelled' };
            fetchBookings(statusMap[tab.dataset.target]);
        });
    });

    // 6. دالة جلب الحجوزات ورسمها
    async function fetchBookings(status) {
        const list = document.getElementById('bookingsList');
        list.innerHTML = '<div class="text-center p-4">جاري التحميل...</div>';

        const { data, error } = await supabaseClient
            .from('bookings')
            .select('id, patient_name, patient_phone, status, created_at')
            .eq('status', status)
            .order('created_at', { ascending: false });

        if (error) {
            list.innerHTML = '<div class="text-center text-red-500">حدث خطأ في تحميل البيانات</div>';
            return;
        }

        if (data.length === 0) {
            list.innerHTML = '<div class="text-center p-4 text-gray-500">لا توجد حجوزات في هذه الحالة</div>';
            return;
        }

        list.innerHTML = data.map(booking => `
            <div class="bg-surface-container-lowest rounded-2xl p-section-padding shadow-[0_4px_20px_rgba(15,23,42,0.05)] flex flex-col gap-stack-sm relative overflow-hidden group">
                <div class="flex justify-between items-start">
                    <div class="pr-2">
                        <h3 class="font-headline-md-mobile text-headline-md-mobile text-on-surface mb-1">${booking.patient_name}</h3>
                        <p class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-1.5">📞 ${booking.patient_phone}</p>
                    </div>
                </div>
                <div class="flex justify-between items-center mt-3 pt-3 border-t border-surface-container-highest">
                    <button onclick="tg.showAlert('نافذة التفاصيل قيد التطوير')" class="text-primary font-label-md text-label-md flex items-center gap-1 hover:bg-primary/5 px-2 py-1 rounded-lg transition-colors">
                        التفاصيل <span class="material-symbols-outlined text-[18px]">chevron_left</span>
                    </button>
                </div>
            </div>
        `).join('');
    }

    // التشغيل الأولي
    fetchBookings('pending');
</script>
