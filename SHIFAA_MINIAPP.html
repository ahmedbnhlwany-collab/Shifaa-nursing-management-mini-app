<script>
        // Initialize Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Modal Logic
        const modal = document.getElementById('emergencyModal');
        const sheet = document.getElementById('modalSheet');

        function openModal() {
            modal.classList.remove('hidden');
            // Small delay to allow display block to apply before animating
            setTimeout(() => {
                modal.classList.remove('modal-enter');
                modal.classList.add('modal-enter-active');
                sheet.classList.remove('sheet-enter');
                sheet.classList.add('sheet-enter-active');
            }, 10);
            
            // Haptic feedback
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        function closeModal() {
            modal.classList.remove('modal-enter-active');
            modal.classList.add('modal-enter');
            sheet.classList.remove('sheet-enter-active');
            sheet.classList.add('sheet-enter');
            
            // Wait for transition to finish before hiding
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // Tab Switching Logic
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                // Reset all tabs
                tabs.forEach(t => {
                    t.className = 'tab-btn px-5 py-2 rounded-full font-label-md text-label-md bg-surface-container-low text-on-surface-variant hover:bg-surface-container whitespace-nowrap transition-all duration-200';
                });
                
                // Set active tab
                tab.className = 'tab-btn px-5 py-2 rounded-full font-label-md text-label-md bg-primary-container text-on-primary-container shadow-sm whitespace-nowrap transition-all duration-200';
                
                // Haptic feedback
                if(tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            });
        });
    </script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // 1. تهيئة تليجرام
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    // 2. إعدادات Supabase (استبدل بالروابط والمفاتيح الخاصة بك)
    const SUPABASE_URL = 'https://zvxzdihonmlglrufrjjl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2eHpkaWhvbm1sZ2xydWZyampsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMjA3MjEsImV4cCI6MjA5ODU5NjcyMX0.cZi4F0K28AiT2aXdr4MUCLbub-zUPUXP1IlPntcxEv8';
    let supabaseClient;

    // 3. المصادقة عبر Edge Function
    async function initApp() {
        try {
            // إرسال بيانات تليجرام للتحقق
            const authResponse = await fetch(`${SUPABASE_URL}/functions/v1/telegram-auth`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ initData: tg.initData }) // بيانات تليجرام المشفرة
            });

            if (!authResponse.ok) throw new Error('فشل المصادقة مع الخادم');
            
            const authData = await authResponse.json();

            // إنشاء عميل Supabase باستخدام الـ JWT الآمن العائد من الدالة
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                global: {
                    headers: { Authorization: `Bearer ${authData.token}` }
                }
            });

            // جلب البيانات الأولية وفتح قناة التحديث اللحظي
            fetchBookings('pending');
            subscribeToRealtime();

        } catch (error) {
            console.error('Auth Error:', error);
            tg.showAlert("غير مصرح لك بالدخول، يرجى التأكد من صلاحيات حسابك.");
        }
    }

    // 4. جلب الحجوزات بناءً على الحالة (التبويب)
    async function fetchBookings(status) {
        if (!supabaseClient) return;
        
        const { data, error } = await supabaseClient
            .from('bookings')
            .select('id, patient_name, patient_phone, status, created_at')
            .eq('status', status)
            .order('created_at', { ascending: false });

        if (error) {
            console.error('Fetch Error:', error);
            return;
        }

        renderBookings(data);
    }

    // دالة مساعدة لرسم البطاقات (يتم ربطها بـ DOM الواجهة)
    function renderBookings(bookings) {
        // سيتم هنا مسح الحجوزات القديمة وإضافة البطاقات الجديدة
        console.log("تم جلب الحجوزات:", bookings);
    }

    // 5. إرسال الطلب اليدوي الآمن (Atomic RPC)
    async function submitEmergencyBooking(name, phone) {
        tg.HapticFeedback.impactOccurred('medium');
        
        const { data, error } = await supabaseClient
            .rpc('create_emergency_booking', {
                p_name: name,
                p_phone: phone,
                p_source: 'telegram_miniapp' // لمنع إشعارات تليجرام المزعجة للطلبات اليدوية
            });

        if (error) {
            tg.showAlert("حدث خطأ أثناء تسجيل الطلب.");
            console.error(error);
        } else {
            tg.HapticFeedback.notificationOccurred('success');
            closeModal(); // إغلاق النافذة
            fetchBookings(document.querySelector('.tab-btn.bg-primary-container').dataset.target); // تحديث القائمة
        }
    }

    // 6. التحديث اللحظي (Real-time Sync)
    function subscribeToRealtime() {
        supabaseClient
            .channel('public:bookings')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, payload => {
                // عند حدوث أي تغيير، نقوم بتحديث القائمة المعروضة حالياً
                const currentTab = document.querySelector('.tab-btn.bg-primary-container').dataset.target;
                fetchBookings(currentTab);
            })
            .subscribe();
    }

    // بدء تشغيل التطبيق
    initApp();
</script>
